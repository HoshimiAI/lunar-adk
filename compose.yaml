services:
  unknown-planet-test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lunar_test
      POSTGRES_USER: lunar_test
      POSTGRES_PASSWORD: lunar_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - unknown-planet-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunar_test -d lunar_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  unknown-planet-test-data:
