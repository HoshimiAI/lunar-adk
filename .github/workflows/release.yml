name: Release verification

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version, without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Live-provider checks are intentionally release-operator steps, not CI.
      - run: bun run test:ci
      - run: bun run audit
      - run: bun run release:check "${{ inputs.version || github.ref_name }}"
